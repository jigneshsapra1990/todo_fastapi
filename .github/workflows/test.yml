name: FastAPI Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_fastapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest psycopg2-binary

      - name: Create .env file
        run: |
          echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5432/todo_fastapi"' > .env
          echo 'APP_NAME="FastAPI Todo App"' >> .env
          echo 'APP_ENV=test' >> .env

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest tests.py -v

          
